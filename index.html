<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sublime - Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --v:#b3124f;--v2:#8e0e3f;--bg:#fcf7f8;--bd:#ece5e8;--mut:#7d6b72;--ink:#2b2024;--ok:#1f9d55;--bad:#d62839;
  --arco:linear-gradient(90deg,#e0245e,#f57c00,#fbc02d,#2ebd59,#1fb2d6,#7c5cd6);
  --glass:rgba(255,255,255,.62);--glass-bd:rgba(255,255,255,.88);
  --side:252px;--top:58px;--rad:16px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-x:env(safe-area-inset-left,0px)
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;font:15px/1.45 Outfit,system-ui,sans-serif;color:var(--ink);letter-spacing:.01em;
  background:
    radial-gradient(900px 500px at 5% -5%,#ffd3e2aa,transparent),
    radial-gradient(800px 520px at 100% 8%,#d8cbf7aa,transparent),
    radial-gradient(800px 500px at 55% 110%,#c4efdbaa,transparent),
    var(--bg);
  background-attachment:fixed;min-height:100dvh
}
button,input,select{font:inherit;touch-action:manipulation}
.logo{font-family:Fraunces,Georgia,serif;font-size:1.85rem;font-weight:700;line-height:1.05;background:var(--arco);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:Fraunces,Georgia,serif;font-weight:600;color:var(--v);font-size:.78rem;line-height:1.25}
a{color:var(--v)}

/* Login */
#login{
  width:min(380px,calc(100% - 32px));margin:max(48px,8vh) auto;text-align:center;padding:28px 24px 26px;
  background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--glass-bd);border-radius:22px;box-shadow:0 18px 50px rgba(179,18,79,.1)
}
#login .logo{font-size:2.2rem;margin-bottom:4px}
#login label{text-align:left}
#login .p{margin-top:8px;min-height:44px}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em;margin:10px 0 4px}

/* App shell — desktop default */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100dvh}
.topbar{display:none}
.scrim{display:none}
.workspace{min-width:0;display:flex;flex-direction:column}
aside{
  background:rgba(255,255,255,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-right:1px solid var(--glass-bd);padding:0 12px 16px;position:sticky;top:0;height:100dvh;
  display:flex;flex-direction:column;z-index:30
}
aside::before{content:"";display:block;height:5px;background:var(--arco);margin:0 -12px 14px;border-radius:0}
.brand{padding:4px 8px 12px}
.userbar{font-size:.72rem;color:var(--mut);padding:0 10px 12px;word-break:break-all;line-height:1.35}
.side-foot{margin-top:auto;padding:10px 4px 4px;display:flex;flex-direction:column;gap:8px}
nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
nav button{
  border:0;background:none;text-align:left;padding:11px 12px;border-radius:12px;font-weight:600;color:#5a4a50;
  cursor:pointer;display:flex;align-items:center;gap:10px;min-height:44px;transition:background .15s,color .15s,transform .12s
}
nav button .ico{width:1.35em;text-align:center;flex:0 0 auto}
nav button .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis}
nav button:hover{background:#fbeef2}
nav button.on{background:var(--v);color:#fff;box-shadow:0 8px 18px rgba(179,18,79,.22)}
nav button:active{transform:scale(.98)}
main{padding:28px 32px calc(48px + var(--safe-b));max-width:1180px;width:100%;margin:0 auto}
h2{margin:0 0 18px;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(1.35rem,2.2vw,1.75rem);color:var(--v)}
h3{margin:0 0 12px;font-family:Fraunces,Georgia,serif;font-size:1.08rem;color:#5a2a3c;font-weight:700}

.card{
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--glass-bd);border-radius:var(--rad);padding:18px 20px;margin-bottom:14px;
  box-shadow:0 8px 28px rgba(179,18,79,.06)
}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:14px}
.grid .card{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.kpi b{display:block;font-size:clamp(1.25rem,2vw,1.55rem);color:var(--v);font-weight:700;letter-spacing:-.02em}
.kpi span,.m{color:var(--mut);font-size:.84rem}

button.p{background:var(--v);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:42px}
button.p:hover{background:var(--v2)}
button.s{background:rgba(251,238,242,.9);color:var(--v);border:0;border-radius:999px;padding:7px 12px;cursor:pointer;font-size:.85rem;font-weight:600;min-height:34px}
button.d{background:#fde8ea;color:var(--bad)}
button:disabled{opacity:.55;cursor:not-allowed}
input,select{width:100%;padding:11px 12px;border:1px solid #e3d6db;border-radius:12px;background:rgba(255,255,255,.82);min-height:42px}
input:focus,select:focus{outline:2px solid #e0245e55;border-color:var(--v)}
label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:10px 8px;border-bottom:1px solid #f3ebee;text-align:left;vertical-align:top}
th{color:var(--mut);font-size:.7rem;text-transform:uppercase;letter-spacing:.045em;font-weight:700}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.tag{padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap;display:inline-block}
.low{background:#fde8ea;color:var(--bad)}.okt{background:#e3f6ea;color:#14753f}.warn{background:#fff3cd;color:#8a6100}.info{background:#e3effd;color:#1f5fb4}
.prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.prod button{border:1px solid var(--glass-bd);background:rgba(255,255,255,.7);border-radius:14px;padding:14px;cursor:pointer;text-align:left;min-height:88px;transition:border-color .15s,background .15s,transform .12s}
.prod button:hover{border-color:var(--v);background:#fff8fa}.prod button:active{transform:scale(.98)}
.prod b{display:block;margin-bottom:4px}.prod small{color:var(--mut);font-size:.78rem;line-height:1.35}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.row.actions{gap:6px}
dialog{border:0;border-radius:20px;padding:22px;width:min(460px,94vw);max-height:min(90vh,900px);overflow:auto;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(60,10,30,.25)}
dialog::backdrop{background:#0007}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:.72rem;color:var(--mut);text-align:center;font-weight:700;padding:2px 0}
.day{min-height:84px;border:1px solid var(--bd);border-radius:12px;padding:6px;background:rgba(255,255,255,.7);cursor:pointer;font-size:.68rem;overflow:hidden;transition:border-color .12s,box-shadow .12s}
.day:hover{border-color:#e0a3b9}.day.sel{border:2px solid var(--v);box-shadow:0 0 0 3px #b3124f22}.day.t{background:#fff5f8}.day b{font-size:.88rem;display:block;margin-bottom:2px}
.chip{display:block;border-radius:6px;padding:2px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c1{background:#e3f6ea;color:#14753f}.c2{background:#ece6fb;color:#5b3fb5}.c3{background:#f1eced;color:#6b5a60}.c4{background:#fde4ee;color:#b3124f}
.up{color:var(--ok);font-weight:700}.dn{color:var(--bad);font-weight:700}
.icon-btn{width:42px;height:42px;border:0;border-radius:12px;background:rgba(251,238,242,.95);color:var(--v);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.icon-btn svg{width:20px;height:20px;display:block}
.topbar .brand-mini{display:flex;flex-direction:column;min-width:0}
.topbar .brand-mini .logo{font-size:1.35rem}
.topbar .brand-mini .sub{font-size:.65rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.page-head h2{margin-bottom:14px}

body.booting #login,body.in #login{display:none!important}
body:not(.in) #app{display:none!important}
body.booting::after{content:"Conectando ao Firebase…";position:fixed;inset:0;display:grid;place-items:center;font:600 1rem Outfit,system-ui,sans-serif;color:var(--mut);background:inherit;z-index:9}

/* Desktop wide */
@media(min-width:1200px){
  :root{--side:268px}
  main{padding:32px 40px 64px;max-width:1280px}
  .grid{gap:14px}
}

/* Tablet */
@media(max-width:1024px) and (min-width:761px){
  :root{--side:200px}
  .shell{grid-template-columns:var(--side) 1fr}
  aside{padding:0 8px 12px}
  .brand .sub{font-size:.68rem}
  nav button{padding:10px 10px;gap:8px;font-size:.92rem}
  nav button .lbl{font-size:.9rem}
  main{padding:22px 20px 48px}
  .grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .day{min-height:70px}
  .prod{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
}

/* Mobile */
@media(max-width:760px){
  .shell{grid-template-columns:1fr;padding-top:calc(var(--top) + var(--safe-t))}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    position:fixed;top:0;left:0;right:0;z-index:40;height:calc(var(--top) + var(--safe-t));
    padding:var(--safe-t) 12px 0 max(12px,var(--safe-x));
    background:rgba(255,255,255,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--glass-bd);box-shadow:0 4px 18px rgba(179,18,79,.06)
  }
  .scrim{display:block;position:fixed;inset:0;background:#1a0a12aa;opacity:0;pointer-events:none;transition:opacity .2s;z-index:45}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  body.nav-open{overflow:hidden}
  aside{
    position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);height:100dvh;transform:translateX(-105%);
    transition:transform .22s ease;border-right:1px solid var(--glass-bd);box-shadow:none;padding-bottom:calc(16px + var(--safe-b))
  }
  body.nav-open aside{transform:translateX(0);box-shadow:18px 0 40px rgba(40,10,20,.2)}
  main{padding:16px 14px calc(28px + var(--safe-b));max-width:none}
  h2{font-size:1.35rem;margin-bottom:14px}
  .card{padding:16px;border-radius:14px;margin-bottom:12px}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .grid2{grid-template-columns:1fr;gap:12px}
  .kpi b{font-size:1.25rem}
  .prod{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .prod button{padding:12px;min-height:80px}
  .day{min-height:54px;padding:4px;border-radius:8px}
  .day b{font-size:.78rem}
  .chip{font-size:.58rem;padding:1px 3px}
  .cal{gap:4px}
  .cal .h{font-size:.62rem}
  table{font-size:.84rem}
  td,th{padding:8px 6px}
  #login{margin:max(28px,6vh) auto;padding:24px 18px}
  dialog{width:min(460px,96vw);padding:18px;border-radius:18px;max-height:min(92dvh,900px)}
  .row{gap:8px}
  button.p,button.s{min-height:40px}
  #cd{width:100%!important;max-width:none}
  .tw{margin:0 -2px}
  .side-foot .s{min-height:44px}
}

/* Very small phones */
@media(max-width:380px){
  .grid{grid-template-columns:1fr}
  .prod{grid-template-columns:1fr 1fr}
  .topbar .brand-mini .sub{display:none}
}
</style>
</head>
<body class="booting">
<div id="login" class="card">
  <div class="logo">Sublime</div>
  <div class="sub">Casa de Pães, Biscoitos e Bolos</div>
  <form id="lf">
    <label>E-mail</label><input id="em" type="email" required autocomplete="username">
    <label>Senha</label><input id="pw" type="password" required autocomplete="current-password">
    <p class="err" id="le"></p>
    <button class="p" style="width:100%">Entrar</button>
  </form>
</div>
<div class="shell" id="app" hidden>
  <header class="topbar">
    <button type="button" class="icon-btn" id="menu" aria-label="Abrir menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand-mini"><div class="logo">Sublime</div><div class="sub">Casa de Pães, Biscoitos e Bolos</div></div>
    <button type="button" class="icon-btn" id="outm" aria-label="Sair" title="Sair">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 7V5a2 2 0 0 1 2-2h7v18h-7a2 2 0 0 1-2-2v-2"/><path d="M4 12h11"/><path d="m8 8-4 4 4 4"/></svg>
    </button>
  </header>
  <div class="scrim" id="scrim"></div>
  <aside id="side">
    <div class="brand"><div class="logo">Sublime</div><div class="sub">Casa de Pães, Biscoitos e Bolos</div></div>
    <div class="userbar" id="who"></div>
    <nav id="nav"></nav>
    <div class="side-foot"><button class="s" id="out" style="width:100%">Sair</button></div>
  </aside>
  <div class="workspace"><main id="main"></main></div>
</div>
<dialog id="dlg"></dialog>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyB5EhvwpfsZuLWPdCX_crQeVj7uioBBWII",
  authDomain: "sublimeplanilhas-4bb2a.firebaseapp.com",
  projectId: "sublimeplanilhas-4bb2a",
  appId: "1:385701064574:web:2d15bc614128e327ec8d2f"
};

const COLS = ["products","supplies","sales","clients","orders","moves"];
const B = "https://www.gstatic.com/firebasejs/10.12.2/";
const J = "https://cdn.jsdelivr.net/npm/firebase@10.12.2/";
const imp = async n => {
  try { return await import(B + "firebase-" + n + ".js"); }
  catch { return await import(J + n + "/+esm"); }
};

let initializeApp, au, fs;
try {
  ({ initializeApp } = await imp("app"));
  au = await imp("auth");
  fs = await imp("firestore");
} catch (e) {
  document.body.classList.remove("booting");
  document.body.innerHTML = '<p style="padding:30px;font-family:sans-serif;max-width:480px">Não foi possível carregar o Firebase. Desative bloqueador de anúncios/privacidade neste site ou use outra rede e recarregue.</p>';
  throw e;
}

const app = initializeApp(firebaseConfig);
const auth = au.getAuth(app);
const db = fs.getFirestore(app);
let user = null;

const $=s=>document.querySelector(s);
const logged = () => !!(user && auth.currentUser);
const authMsg = code => ({
  "auth/invalid-credential": "E-mail ou senha incorretos.",
  "auth/wrong-password": "E-mail ou senha incorretos.",
  "auth/user-not-found": "E-mail ou senha incorretos.",
  "auth/invalid-email": "E-mail inválido.",
  "auth/too-many-requests": "Muitas tentativas. Aguarde e tente de novo.",
  "auth/network-request-failed": "Falha de rede ao conectar no Firebase.",
  "auth/user-disabled": "Esta conta está desativada.",
  "permission-denied": "Sem permissão no Firestore. Atualize as regras para users/{userId}/… com request.auth.uid == userId."
}[code] || "Não foi possível concluir. Tente de novo.");

async function needAuth() {
  if (logged()) return true;
  alert(authMsg("permission-denied"));
  await au.signOut(auth);
  return false;
}

function dbFail(e) {
  console.error("[Firestore]", e);
  const msg = authMsg(e?.code);
  if (e?.code === "permission-denied") {
    au.signOut(auth);
    $("#le").textContent = msg;
  } else alert(msg);
  throw e;
}

const cv = o => Object.fromEntries(Object.entries(o).map(([k,v]) => [k, v && v.inc !== undefined ? fs.increment(v.inc) : v]));
const uid = () => auth.currentUser?.uid;
const colRef = c => fs.collection(db, "users", uid(), c);
const docRef = (c, id) => fs.doc(db, "users", uid(), c, id);

const DB = {
  sub: (c, cb) => {
    if (!logged()) return () => {};
    return fs.onSnapshot(
      colRef(c),
      s => cb(s.docs.map(x => ({ id: x.id, ...x.data() }))),
      e => dbFail(e)
    );
  },
  add: async (c, o) => {
    if (!(await needAuth())) return;
    try { return await fs.addDoc(colRef(c), cv(o)); }
    catch (e) { return dbFail(e); }
  },
  upd: async (c, id, o) => {
    if (!(await needAuth())) return;
    try { return await fs.updateDoc(docRef(c, id), cv(o)); }
    catch (e) { return dbFail(e); }
  },
  del: async (c, id) => {
    if (!(await needAuth())) return;
    try { return await fs.deleteDoc(docRef(c, id)); }
    catch (e) { return dbFail(e); }
  },
  batch: async ops => {
    if (!(await needAuth())) return;
    try {
      const b = fs.writeBatch(db);
      ops.forEach(p => {
        if (p.t === "set") b.set(fs.doc(colRef(p.c)), cv(p.o));
        else if (p.t === "upd") b.update(docRef(p.c, p.id), cv(p.o));
        else b.delete(docRef(p.c, p.id));
      });
      await b.commit();
    } catch (e) { return dbFail(e); }
  }
};

const Auth = {
  on: cb => au.onAuthStateChanged(auth, cb),
  login: (e, p) => au.signInWithEmailAndPassword(auth, e.trim().toLowerCase(), p),
  out: () => au.signOut(auth)
};

const pad = n => String(n).padStart(2, "0");
const dk = t => { const d = new Date(t); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const ym = t => dk(t).slice(0, 7);
const fd = d => d ? d.split("-").reverse().join("/") : "";
const S = { products:[], supplies:[], sales:[], clients:[], orders:[], moves:[], cart:[], tab:"painel", month:ym(Date.now()), day:"", mk:"todos" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const R = v => (+v || 0).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
const D = t => new Date(t).toLocaleString("pt-BR", { dateStyle:"short", timeStyle:"short" });
const H = t => new Date(t).toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" });
const TABS = {
  painel:["📊","Painel"], vender:["🛒","Vender"], calendario:["📅","Calendário"], encomendas:["🎂","Encomendas"],
  clientes:["👥","Clientes"], produtos:["🥖","Produtos"], insumos:["📦","Insumos"], movimentos:["🔁","Movimentações"], vendas:["🧾","Vendas"]
};
const tabLabel = k => `${TABS[k][0]} ${TABS[k][1]}`;
const STS = ["Pendente","Em produção","Pronto","Entregue","Cancelada"], STC = { Pendente:"warn", "Em produção":"info", Pronto:"okt", Entregue:"okt", Cancelada:"low" };
let unsubs = [];

const closeNav = () => document.body.classList.remove("nav-open");
const openNav = () => document.body.classList.add("nav-open");
$("#nav").innerHTML = Object.entries(TABS).map(([k,[ico,lbl]]) => `<button type="button" data-t="${k}"><span class="ico">${ico}</span><span class="lbl">${lbl}</span></button>`).join("");
$("#nav").onclick = e => {
  if (!logged()) return;
  const t = e.target.closest("button")?.dataset.t;
  if (t) { S.tab = t; closeNav(); render(); }
};
$("#menu").onclick = () => document.body.classList.toggle("nav-open");
$("#scrim").onclick = closeNav;
$("#out").onclick = () => { closeNav(); Auth.out(); };
$("#outm").onclick = () => { closeNav(); Auth.out(); };
addEventListener("keydown", e => { if (e.key === "Escape") closeNav(); });
addEventListener("resize", () => { if (matchMedia("(min-width:761px)").matches) closeNav(); });
$("#lf").onsubmit = async e => {
  e.preventDefault();
  $("#le").textContent = "";
  const btn = e.target.querySelector("button");
  btn.disabled = true;
  try { await Auth.login($("#em").value, $("#pw").value); }
  catch (err) { $("#le").textContent = authMsg(err?.code); }
  finally { btn.disabled = false; }
};

function form(title, fields, save) {
  if (!logged()) return;
  const d = $("#dlg");
  d.innerHTML = `<h3>${esc(title)}</h3><form>${fields.map(f => `<label>${f.l}</label>` +
    (f.o ? `<select name="${f.k}">${f.o.map(o => `<option ${o == f.v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`

const UB = { g:["m",1], kg:["m",1000], ml:["v",1], L:["v",1000], "un.":["u",1] };
const FAM = u => ({ m:["g","kg"], v:["ml","L"], u:["un."] }[(UB[u] || ["u"])[0]]);
const conv = (q,a,b) => UB[a] && UB[b] && UB[a][0] === UB[b][0] ? q * UB[a][1] / UB[b][1] : q;
const nm = p => (p.code ? p.code + " - " : "") + p.name;
const uu = p => p.und || "un.";
const mvo = (kind,id,name,d,why,unit,extra={}) => ({ ts:Date.now(), kind, id, name, d, why, unit, ...extra });
const MV = (kind,id,name,d,why,unit,extra) => ({ t:"set", c:"moves", o:mvo(kind,id,name,d,why,unit,extra) });
const avgCost = (oldQty, oldCost, addQty, pay) => {
  const nq = (oldQty || 0) + addQty;
  if (!(addQty > 0) || !(pay > 0)) return +(oldCost || 0);
  return +(nq > 0 ? ((oldQty || 0) * (oldCost || 0) + pay) / nq : pay / addQty).toFixed(6);
};
const stockVal = p => +((p.qty || 0) * (p.cost || 0)).toFixed(2);
const recipeCost = p => {
  if (!p.rec?.length) return null;
  let t = 0;
  for (const r of p.rec) {
    const s = S.supplies.find(x => x.id === r.id);
    if (!s) continue;
    t += conv(r.q, r.u || s.unit, s.unit) * (s.cost || 0);
  }
  return +((t / (p.rend || 1))).toFixed(2);
};

    const top = {}, ch = {}; ms.forEach(s => { ch[s.ch] = (ch[s.ch] || 0) + s.total; s.items.forEach(i => top[i.name] = (top[i.name] || 0) + i.q); });
    const tp = Object.entries(top).sort((a,b) => b[1] - a[1]).slice(0,5), pm = mm.filter(x => x.kind === "produto"), im = mm.filter(x => x.kind === "insumo");
    const dv = S.sales.filter(s => dk(s.ts) === S.day), dO = S.orders.filter(o => o.date === S.day), dM = S.moves.filter(x => dk(x.ts) === S.day), dB = S.clients.filter(c => c.nasc && c.nasc.slice(5) === S.day.slice(5));
    return `<div class="row"><button class="s" onclick="A.nav(-1)">◀</button><h3 style="margin:0;text-transform:capitalize">${mlabel()}</h3><button class="s" onclick="A.nav(1)">▶</button></div>
    <div class="grid">${K(R(sum(ms)), "Vendas (" + ms.length + ")")}${K(R(ms.length ? sum(ms) / ms.length : 0), "Ticket médio")}${K(mo.length + " • " + R(mo.reduce((a,o) => a + o.val, 0)), "Encomendas no mês")}
    ${K(mo.filter(o => o.status === "Entregue").length, "Encomendas entregues")}${K(pm.filter(x => x.d > 0).reduce((a,x) => a + x.d, 0) + " / " + -pm.filter(x => x.d < 0).reduce((a,x) => a + x.d, 0) + " un.", "Produtos: entradas / saídas")}${K(im.filter(x => x.d > 0).length + " / " + im.filter(x => x.d < 0).length, "Insumos: nº entradas / saídas")}</div>
    <div class="grid2"><div class="card"><h3>🏆 Mais vendidos</h3>${tp.length ? T(["Produto","Un."], tp.map(([a,b]) => [esc(a), b])) : empty("Sem vendas no mês.")}</div>
    <div class="card"><h3>📍 Por canal</h3>${Object.keys(ch).length ? T(["Canal","Total"], Object.entries(ch).map(([a,b]) => [esc(a), R(b)])) : empty("Sem vendas no mês.")}</div></div>
    <div class="card"><div class="cal">${["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(d => `<div class="h">${d}</div>`).join("")}${cells}</div>
    <p class="m"><span class="tag okt">vendas</span> <span class="tag" style="background:#ece6fb;color:#5b3fb5">entregas</span> <span class="tag" style="background:#f1eced">movimentações</span> <span class="tag" style="background:#fde4ee;color:#b3124f">aniversários</span> - toque num dia para ver o registro.</p></div>
    <div class="card"><h3>Registro de ${fd(S.day)}</h3>
    ${dB.length ? `<p><b>Aniversariantes</b></p>` + T(["Cliente","Contato","Restrições"], dB.map(c => [esc(c.name), esc(c.phone), esc(c.restr)])) : ""}
    <p><b>Vendas</b> ${dv.length ? "- " + R(sum(dv)) : ""}</p>${dv.length ? T(["Hora","Itens","Canal","Pgto","Total"], dv.map(s => [H(s.ts), s.items.map(i => `${i.q}x ${esc(i.name)}`).join(", ") + (s.client ? ` <small>(${esc(s.client)})</small>` : ""), esc(s.ch), esc(s.pay), R(s.total)])) : empty("Sem vendas neste dia.")}
    <p><b>Encomendas para entrega</b></p>${dO.length ? T(["Cliente","Pedido","Valor","A receber","Status"], dO.map(o => [esc(o.client), esc(o.desc), R(o.val), R(Math.max(0, o.val - o.sinal)), `<span class="tag ${STC[o.status]}">${o.status}</span>`])) : empty("Nenhuma entrega neste dia.")}
    <p><b>Movimentações de estoque</b></p>${dM.length ? T(mvHead, mvRows([...dM])) : empty("Sem movimentações neste dia.")}</div>`;
  },
  encomendas() {
    const l = [...S.orders].sort((a,b) => (open().includes(a) ? 0 : 1) - (open().includes(b) ? 0 : 1) || (a.date > b.date ? 1 : -1));
    return `<div class="card"><div class="row"><h3>Encomendas</h3><button class="p" onclick="A.ord()">+ Nova encomenda</button></div>${l.length ? T(["Entrega","Cliente","Pedido","Valor","A receber","Status",""], l.map(o => [...orderRows([o])[0],
      (["Entregue","Cancelada","Pronto"].includes(o.status) && o.status !== "Pronto" ? "" : Bt(o.status === "Pronto" ? "✓ Entregue" : "Avançar", "A.next('" + o.id + "')")) + " " + Bt("Editar", "A.ord('" + o.id + "')") + " " + Bt("✕", "A.del('orders','" + o.id + "')", "d")])) : empty("Nenhuma encomenda cadastrada.")}</div>`;
  },
  clientes() {
    return `<div class="card"><div class="row"><h3>Clientes</h3><button class="p" onclick="A.cli()">+ Novo cliente</button></div>${S.clients.length ? T(["Cliente","Contato","Aniversário","Restrições","Compras","Total gasto",""],
      [...S.clients].sort((a,b) => a.name.localeCompare(b.name)).map(c => {
        const vs = S.sales.filter(s => s.client === c.name), dg = (c.phone || "").replace(/\D/g, "");
        return [`<b>${esc(c.name)}</b>${c.addr ? `<br><small class="m">${esc(c.addr)}</small>` : ""}`, dg ? `<a href="https://wa.me/55${dg}" target="_blank" rel="noopener">${esc(c.phone)}</a>` : "", c.nasc ? bd(c.nasc) : "", esc(c.restr), vs.length, R(sum(vs)), Bt("Editar", "A.cli('" + c.id + "')") + " " + Bt("✕", "A.del('clients','" + c.id + "')", "d")];
      })) : empty("Nenhum cliente cadastrado.")}</div>`;
  },
  produtos() {
    return `<div class="card"><div class="row"><h3>Produtos</h3><button class="p" onclick="A.prod()">+ Novo produto</button></div>${T(["Código","Produto","Preço","Custo est.","Estoque","Receita",""],
      [...S.products].sort((a,b) => (a.code || "").localeCompare(b.code || "")).map(p => {
        const rc = recipeCost(p);
        return [`<b>${esc(p.code)}</b>`, esc(p.name) + (p.active === false ? " <small class=m>(fora de venda)</small>" : "") + `<br><small class="m">${[p.cat, p.peso, p.desc].filter(Boolean).map(x => esc(x)).join(" - ")}</small>`, R(p.price),
        rc == null ? '<span class="m">—</span>' : `${R(rc)}${p.price > 0 ? `<br><small class="m">margem ${(((p.price - rc) / p.price) * 100).toFixed(0)}%</small>` : ""}`,
        p.stock + " " + esc(uu(p)) + " " + stockTag(p.stock, p.min),
        p.rec && p.rec.length ? p.rec.length + " insumo(s) - rende " + (p.rend || 1) : '<span class="m">sem receita</span>',
        Bt("± estoque", "A.adj('products','" + p.id + "')") + " " + Bt("Receita", "A.rec('" + p.id + "')") + " " + Bt("Editar", "A.prod('" + p.id + "')") + " " + Bt("✕", "A.del('products','" + p.id + "')", "d")];
      }))}</div>`;
  },
  insumos() {
    const tot = S.supplies.reduce((a,p) => a + stockVal(p), 0);
    return `<div class="card"><div class="row"><h3>Insumos (farinhas, castanhas, etc.)</h3><button class="p" onclick="A.sup()">+ Novo insumo</button></div>
    <p class="m" style="margin-top:-4px">Estoque valorizado: <b>${R(tot)}</b> (pelo custo médio)</p>
    ${T(["Código","Insumo","Quantidade","Custo/un.","Última compra","Em estoque",""],
      [...S.supplies].sort((a,b) => (a.code || "").localeCompare(b.code || "")).map(p => [
        `<b>${esc(p.code)}</b>`, esc(p.name),
        p.qty + " " + esc(p.unit) + " " + stockTag(p.qty, p.min),
        p.cost > 0 ? R(p.cost) + "/" + esc(p.unit) : '<span class="m">sem custo</span>',
        p.lastCost > 0 ? R(p.lastCost) + "/" + esc(p.unit) + (p.lastPay > 0 ? `<br><small class="m">pagou ${R(p.lastPay)}</small>` : "") : '<span class="m">—</span>',
        R(stockVal(p)),
        Bt("± estoque", "A.adj('supplies','" + p.id + "')") + " " + Bt("Editar", "A.sup('" + p.id + "')") + " " + Bt("✕", "A.del('supplies','" + p.id + "')", "d")
      ]))}</div>`;
  },
  movimentos() {
    const l = S.moves.filter(x => ym(x.ts) === S.month && (S.mk === "todos" || x.kind === S.mk));
    const spent = buySpend(S.moves.filter(x => ym(x.ts) === S.month));
    return `<div class="card"><div class="row"><h3>Entradas e saídas de estoque</h3><div class="row" style="margin:0"><input type="month" value="${S.month}" onchange="A.month(this.value)" style="width:auto">
    <select onchange="A.mk(this.value)" style="width:auto">${["todos","produto","insumo"].map(k => `<option value="${k}" ${k === S.mk ? "selected" : ""}>${k === "todos" ? "Todos" : k === "produto" ? "Produtos" : "Insumos"}</option>`).join("")}</select></div></div>
    <p class="m">Compras de insumos no mês (com valor informado): <b>${R(spent)}</b></p>
    ${l.length ? T(mvHead, mvRows(l)) : empty("Nenhuma movimentação neste mês.")}</div>`;
  },
  vendas() {
    const m = monthSales();
    return `<div class="card"><div class="row"><h3>Vendas</h3><div class="row" style="margin:0"><input type="month" value="${S.month}" onchange="A.month(this.value)" style="width:auto"><button class="s" onclick="A.csv()">⬇ CSV</button></div></div>
    <p><b>${R(sum(m))}</b> em ${m.length} vendas</p>${T(["Data","Itens","Canal","Pgto","Total",""], m.map(s => [D(s.ts), s.items.map(i => `${i.q}x ${esc(i.name)}`).join(", ") + (s.client ? `<br><small class="m">${esc(s.client)}</small>` : ""), esc(s.ch), esc(s.pay), R(s.total), Bt("Cancelar", "A.cancel('" + s.id + "')", "d")]))}</div>`;
  }
};

function render() {
  if (!logged()) return;
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.t === S.tab));
  const keep = ["ch","pay","cl"].map(i => $("#" + i)?.value);
  $("#main").innerHTML = `<h2>${tabLabel(S.tab)}</h2>` + V[S.tab]();
  if (S.tab === "vender") ["ch","pay","cl"].forEach((i,n) => { if (keep[n]) $("#" + i).value = keep[n]; });
}

function gate(u) {
  user = u || null;
  document.body.classList.remove("booting");
  closeNav();
  unsubs.forEach(f => f());
  unsubs = [];
  S.cart = [];
  S.tab = "painel";
  COLS.forEach(c => S[c] = []);
  $("#main").innerHTML = "";
  const d = $("#dlg"); if (d.open) d.close();
  document.body.classList.toggle("in", !!user);
  $("#login").hidden = !!user;
  $("#app").hidden = !user;
  if (!user) {
    $("#who").textContent = "";
    return;
  }
  $("#who").textContent = user.email || "";
  for (const c of COLS) unsubs.push(DB.sub(c, l => { S[c] = l; render(); }));
}

Auth.on(gate);
</script>
</body>
</html>
